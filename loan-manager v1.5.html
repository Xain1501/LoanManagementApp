<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Loan Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    padding-bottom: 90px;
  }
  header {
    padding: 20px 16px 12px;
    background: #15181f;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #23262f;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    background: #1b1f28;
    border: 1px solid #262a35;
    color: #9aa0ab;
    font-size: 12px;
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
  }
  .icon-btn:active { background: #262a35; }
  .backup-banner {
    display: none;
    margin-top: 12px;
    background: #2a2410;
    border: 1px solid #4a3f14;
    color: #e9c76b;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .backup-banner.show { display: block; }
  .summary {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .card {
    flex: 1;
    background: #1b1f28;
    border-radius: 12px;
    padding: 12px;
  }
  .card .label { font-size: 12px; color: #9aa0ab; }
  .card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .receivable .value { color: #4ade80; }
  .payable .value { color: #f87171; }
  .net .value { font-size: 18px; }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: #1b1f28;
    color: #9aa0ab;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #262a35;
  }
  .tab.active {
    background: #3b6ef6;
    color: #fff;
    border-color: #3b6ef6;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .toolbar input[type="text"].search-input {
    flex: 1;
    background: #1b1f28;
    border: 1px solid #262a35;
    border-radius: 10px;
    padding: 9px 12px;
    color: #e8e8e8;
    font-size: 14px;
  }
  .toolbar select.sort-select {
    background: #1b1f28;
    border: 1px solid #262a35;
    border-radius: 10px;
    padding: 9px 8px;
    color: #9aa0ab;
    font-size: 13px;
    max-width: 128px;
  }

  .view-toggle {
    display: flex;
    margin: 14px 16px 0;
    background: #1b1f28;
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .view-toggle button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #9aa0ab;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .view-toggle button.active {
    background: #3b6ef6;
    color: #fff;
  }

  #peopleList {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .people-subtabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .person-card {
    background: #1b1f28;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
  }
  .person-card:active { background: #20242e; }
  .person-card .pname-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .person-card .pname { font-weight: 700; font-size: 15px; }
  .archive-btn {
    background: #14161c;
    border: 1px solid #262a35;
    color: #9aa0ab;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .archive-btn.unarchive { color: #60a5fa; border-color: #2c4a7a; }
  .person-stats {
    display: flex;
    gap: 8px;
  }
  .stat-chip {
    flex: 1;
    background: #14161c;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-chip .stat-label {
    font-size: 10px;
    color: #7a808c;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .stat-chip .stat-value {
    font-size: 13px;
    font-weight: 700;
    margin-top: 3px;
  }
  .stat-chip.chip-payable .stat-value { color: #f87171; }
  .stat-chip.chip-receivable .stat-value { color: #4ade80; }
  .stat-chip.chip-net .stat-value { color: #60a5fa; }

  .person-detail {
    display: none;
    position: fixed;
    inset: 0;
    background: #0f1115;
    z-index: 40;
    overflow-y: auto;
  }
  .person-detail.show { display: block; }
  .pd-header {
    padding: 18px 16px 16px;
    background: #15181f;
    border-bottom: 1px solid #23262f;
    position: sticky;
    top: 0;
  }
  .pd-back {
    background: none;
    border: none;
    color: #9aa0ab;
    font-size: 14px;
    padding: 4px 0 12px;
    cursor: pointer;
  }
  .pd-header .pname-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .pd-header .pname { font-size: 19px; font-weight: 700; }
  .pd-body {
    padding: 14px 16px 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pd-section-label {
    font-size: 12px;
    color: #7a808c;
    text-transform: uppercase;
    letter-spacing: .3px;
    margin: 10px 0 2px;
  }

  #list {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .entry {
    background: #1b1f28;
    border-radius: 12px;
    padding: 14px;
    position: relative;
    border-left: 4px solid #f87171;
  }
  .entry.receivable { border-left-color: #4ade80; }
  .entry .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .entry .name { font-weight: 700; font-size: 15px; }
  .entry .amount { font-weight: 700; font-size: 15px; }
  .entry.payable .amount { color: #f87171; }
  .entry.receivable .amount { color: #4ade80; }
  .entry .desc { color: #b5bac4; font-size: 13px; margin-top: 6px; }
  .entry .date { color: #6b7280; font-size: 12px; margin-top: 8px; }
  .entry .del {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: #6b7280;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .entry .name-row { padding-right: 26px; }
  .entry.settled { opacity: .55; }
  .entry.settled .amount { text-decoration: line-through; }
  .settled-badge {
    display: inline-block;
    background: #262a35;
    color: #9aa0ab;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    margin-left: 8px;
    text-decoration: none;
    vertical-align: middle;
  }
  .progress-track {
    height: 6px;
    background: #262a35;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-fill { height: 100%; border-radius: 4px; }
  .entry.payable .progress-fill { background: #f87171; }
  .entry.receivable .progress-fill { background: #4ade80; }
  .progress-label {
    font-size: 11px;
    color: #7a808c;
    margin-top: 5px;
  }
  .entry-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .payment-btn {
    background: #14161c;
    border: 1px solid #262a35;
    color: #9aa0ab;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .payments-toggle {
    background: none;
    border: none;
    color: #60a5fa;
    font-size: 11px;
    padding: 5px 0;
    cursor: pointer;
    margin-top: 6px;
    display: inline-block;
  }
  .payments-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .payment-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #14161c;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    color: #b5bac4;
  }
  .payment-row .p-del {
    background: none;
    border: none;
    color: #6b7280;
    font-size: 14px;
    cursor: pointer;
    padding: 0 4px;
  }

  .quick-add-btn {
    background: #14161c;
    border: 1px solid #2c4a7a;
    color: #60a5fa;
    font-size: 15px;
    font-weight: 700;
    width: 26px;
    height: 26px;
    line-height: 1;
    border-radius: 7px;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    color: #6b7280;
    padding: 60px 20px;
    font-size: 14px;
  }

  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #3b6ef6;
    color: #fff;
    font-size: 28px;
    border: none;
    box-shadow: 0 6px 16px rgba(59,110,246,0.4);
    cursor: pointer;
    z-index: 20;
  }

  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    align-items: flex-end;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #15181f;
    width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 20px 18px 26px;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: #9aa0ab;
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: #1b1f28;
    border: 1px solid #262a35;
    border-radius: 10px;
    padding: 11px 12px;
    color: #e8e8e8;
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea { resize: none; min-height: 60px; }
  .type-toggle {
    display: flex;
    gap: 8px;
  }
  .type-toggle button {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid #262a35;
    background: #1b1f28;
    color: #9aa0ab;
    font-size: 14px;
    cursor: pointer;
  }
  .type-toggle button.active.payable { background: #f87171; color: #1b1f28; border-color: #f87171; font-weight: 700; }
  .type-toggle button.active.receivable { background: #4ade80; color: #1b1f28; border-color: #4ade80; font-weight: 700; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel { background: #1b1f28; color: #9aa0ab; border: 1px solid #262a35 !important; }
  .btn-save { background: #3b6ef6; color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Loan Manager</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportData()">Export</button>
      <button class="icon-btn" onclick="document.getElementById('importFile').click()">Import</button>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  <div class="backup-banner" id="backupBanner" onclick="exportData()"></div>
  <div class="summary">
    <div class="card receivable">
      <div class="label">Receivable (PKR)</div>
      <div class="value" id="totalReceivable">0</div>
    </div>
    <div class="card payable">
      <div class="label">Payable (PKR)</div>
      <div class="value" id="totalPayable">0</div>
    </div>
    <div class="card net">
      <div class="label">Net</div>
      <div class="value" id="netValue">0</div>
    </div>
  </div>
</header>

<div class="view-toggle">
  <button class="active" data-view="entries" onclick="switchView('entries')">Entries</button>
  <button data-view="people" onclick="switchView('people')">People</button>
</div>

<div class="tabs" id="filterTabs">
  <div class="tab active" data-filter="all">All</div>
  <div class="tab" data-filter="receivable">Receivable</div>
  <div class="tab" data-filter="payable">Payable</div>
</div>

<div class="toolbar" id="entryToolbar">
  <input type="text" class="search-input" id="entrySearch" placeholder="Search by name..." oninput="onEntrySearch(this.value)">
  <select class="sort-select" id="entrySort" onchange="onEntrySort(this.value)">
    <option value="date-desc">Newest first</option>
    <option value="date-asc">Oldest first</option>
    <option value="amount-desc">Amount: high-low</option>
    <option value="amount-asc">Amount: low-high</option>
    <option value="name-asc">Name: A-Z</option>
  </select>
</div>

<div id="list"></div>
<div id="peopleWrap" style="display:none">
  <div class="people-subtabs" id="peopleSubtabs">
    <div class="tab active" data-sub="active">Active</div>
    <div class="tab" data-sub="archived">Archived</div>
  </div>
  <div class="toolbar">
    <input type="text" class="search-input" id="peopleSearch" placeholder="Search by name..." oninput="onPeopleSearch(this.value)">
  </div>
  <div id="peopleList"></div>
</div>

<div class="person-detail" id="personDetail">
  <div class="pd-header">
    <button class="pd-back" onclick="closePersonDetail()">&larr; Back to People</button>
    <div class="pname-row">
      <div class="pname" id="pdName"></div>
      <button class="icon-btn" id="pdArchiveBtn" onclick="toggleArchiveFromDetail()"></button>
    </div>
    <div class="person-stats">
      <div class="stat-chip chip-payable">
        <div class="stat-label">Payable</div>
        <div class="stat-value" id="pdPayable">0</div>
      </div>
      <div class="stat-chip chip-receivable">
        <div class="stat-label">Receivable</div>
        <div class="stat-value" id="pdReceivable">0</div>
      </div>
      <div class="stat-chip chip-net">
        <div class="stat-label">Net</div>
        <div class="stat-value" id="pdNet">0</div>
      </div>
    </div>
  </div>
  <div class="pd-body" id="pdBody"></div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>New Entry</h2>
    <div class="field">
      <label>Type</label>
      <div class="type-toggle">
        <button type="button" id="btnPayable" onclick="setType('payable')">I Owe (Payable)</button>
        <button type="button" id="btnReceivable" onclick="setType('receivable')">Owed to Me (Receivable)</button>
      </div>
    </div>
    <div class="field">
      <label>Person Name</label>
      <input type="text" id="inputName" placeholder="e.g. Ahmed">
    </div>
    <div class="field">
      <label>Amount (PKR)</label>
      <input type="text" id="inputAmount" placeholder="e.g. 5,000" inputmode="decimal" oninput="onAmountInput(this)">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="inputDesc" placeholder="e.g. Borrowed for rent"></textarea>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="inputDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="paymentModalBg">
  <div class="modal">
    <h2>Add Payment</h2>
    <div id="paymentRemainingLabel" style="color:#9aa0ab; font-size:13px; margin-bottom:14px;"></div>
    <div class="field">
      <label>Payment Amount (PKR)</label>
      <input type="text" id="paymentAmount" placeholder="e.g. 500" inputmode="decimal" oninput="onAmountInput(this)">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="paymentDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePaymentModal()">Cancel</button>
      <button class="btn-save" onclick="savePayment()">Save Payment</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'loan_manager_entries_v1';
  const ARCHIVE_KEY = 'loan_manager_archived_v1';

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  // Migrates a single entry from any prior schema into the current one.
  // v1.0-1.4 entries have no `payments` field, just a boolean `settled`.
  // A settled:true entry is converted into one payment covering the
  // full amount (so its remaining balance is correctly 0). A settled
  // false/absent entry gets an empty payments array (full amount owed),
  // matching its old behavior exactly. Already-migrated entries
  // (payments already an array) pass through unchanged.
  function migrateEntry(e) {
    if (!Array.isArray(e.payments)) {
      if (e.settled === true) {
        e.payments = [{ id: genId(), amount: Number(e.amount) || 0, date: e.date || todayStr() }];
      } else {
        e.payments = [];
      }
    } else {
      e.payments = e.payments
        .map(p => ({
          id: p.id ? String(p.id) : genId(),
          amount: Number(p.amount) || 0,
          date: p.date ? String(p.date) : todayStr()
        }))
        .filter(p => p.amount > 0);
    }
    delete e.settled;
    return e;
  }

  function paymentsSum(e) {
    return (e.payments || []).reduce((s, p) => s + Number(p.amount), 0);
  }

  function remaining(e) {
    return Math.max(0, Number(e.amount) - paymentsSum(e));
  }

  function isSettled(e) {
    return remaining(e) <= 0;
  }

  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').map(migrateEntry);
  let archivedNames = new Set(JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'));
  let currentType = 'payable';
  let currentFilter = 'all';
  let viewMode = 'entries';
  let peopleSubView = 'active';
  let currentPersonName = null;
  let entrySearchQuery = '';
  let peopleSearchQuery = '';
  let entrySortBy = 'date-desc';
  let paymentEntryId = null;
  let expandedPayments = new Set();

  function afterMutate() {
    render();
    if (currentPersonName && document.getElementById('personDetail').classList.contains('show')) {
      openPersonDetail(currentPersonName);
    }
  }

  function saveArchive() {
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify([...archivedNames]));
  }

  function switchView(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.view === mode);
    });
    document.getElementById('filterTabs').style.display = mode === 'entries' ? 'flex' : 'none';
    document.getElementById('entryToolbar').style.display = mode === 'entries' ? 'flex' : 'none';
    document.getElementById('list').style.display = mode === 'entries' ? 'flex' : 'none';
    document.getElementById('peopleWrap').style.display = mode === 'people' ? 'block' : 'none';
    render();
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function fmt(n) {
    return Number(n).toLocaleString('en-PK');
  }

  function render() {
    const list = document.getElementById('list');
    let totalPayable = 0, totalReceivable = 0;
    entries.forEach(e => {
      if (e.type === 'payable') totalPayable += remaining(e);
      else totalReceivable += remaining(e);
    });
    document.getElementById('totalPayable').textContent = fmt(totalPayable);
    document.getElementById('totalReceivable').textContent = fmt(totalReceivable);
    const net = totalReceivable - totalPayable;
    const netEl = document.getElementById('netValue');
    netEl.textContent = (net >= 0 ? '+' : '-') + fmt(Math.abs(net));
    netEl.style.color = net >= 0 ? '#4ade80' : '#f87171';

    let filtered = entries;
    if (currentFilter !== 'all') filtered = filtered.filter(e => e.type === currentFilter);
    if (entrySearchQuery.trim()) {
      const q = entrySearchQuery.trim().toLowerCase();
      filtered = filtered.filter(e => e.name.toLowerCase().includes(q));
    }
    filtered = [...filtered].sort(sortComparator(entrySortBy));

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No entries found.</div>';
    } else {
      list.innerHTML = filtered.map(e => entryCardHtml(e)).join('');
    }

    renderPeople();
  }

  // Shared renderer for an entry card, used in both the Entries list
  // and a person's detail history. `opts.label` overrides the name
  // shown (used in person detail to show "You owe" / "Owed to you").
  function entryCardHtml(e, opts) {
    opts = opts || {};
    const rem = remaining(e);
    const paid = paymentsSum(e);
    const settled = rem <= 0;
    const pct = Number(e.amount) > 0 ? Math.min(100, Math.round((paid / Number(e.amount)) * 100)) : 0;
    const showProgress = paid > 0 && !settled;
    const expanded = expandedPayments.has(e.id);
    const nameHtml = opts.label ? opts.label : escapeHtml(e.name);
    const payments = e.payments || [];

    const paymentsHtml = payments.length ? `
      <button class="payments-toggle" onclick="event.stopPropagation(); togglePayments('${e.id}')">${expanded ? 'Hide' : 'View'} payments (${payments.length})</button>
      ${expanded ? `<div class="payments-list">
        ${[...payments].sort((a, b) => new Date(b.date) - new Date(a.date)).map(p => `
          <div class="payment-row">
            <span>PKR ${fmt(p.amount)} &middot; ${formatDate(p.date)}</span>
            <button class="p-del" onclick="event.stopPropagation(); deletePayment('${e.id}','${p.id}')">&times;</button>
          </div>
        `).join('')}
      </div>` : ''}
    ` : '';

    return `
      <div class="entry ${e.type} ${settled ? 'settled' : ''}">
        <button class="del" onclick="event.stopPropagation(); deleteEntry('${e.id}')">&times;</button>
        <div class="top">
          <div class="name-row">
            <div class="name">${nameHtml}${settled ? '<span class="settled-badge">Settled</span>' : ''}</div>
          </div>
          <div class="amount">${e.type === 'payable' ? '-' : '+'} PKR ${fmt(rem)}</div>
        </div>
        ${showProgress ? `
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">PKR ${fmt(paid)} of ${fmt(e.amount)} paid</div>
        ` : ''}
        ${e.desc ? `<div class="desc">${escapeHtml(e.desc)}</div>` : ''}
        <div class="date">${formatDate(e.date)}</div>
        ${!settled ? `<div class="entry-actions"><button class="payment-btn" onclick="event.stopPropagation(); openPaymentModal('${e.id}')">Add Payment</button></div>` : ''}
        ${paymentsHtml}
      </div>
    `;
  }

  function sortComparator(sortBy) {
    switch (sortBy) {
      case 'date-asc': return (a, b) => new Date(a.date) - new Date(b.date);
      case 'amount-desc': return (a, b) => remaining(b) - remaining(a);
      case 'amount-asc': return (a, b) => remaining(a) - remaining(b);
      case 'name-asc': return (a, b) => a.name.localeCompare(b.name);
      case 'date-desc':
      default: return (a, b) => new Date(b.date) - new Date(a.date);
    }
  }

  function onEntrySearch(val) {
    entrySearchQuery = val;
    render();
  }

  function onEntrySort(val) {
    entrySortBy = val;
    render();
  }

  function onPeopleSearch(val) {
    peopleSearchQuery = val;
    renderPeople();
  }

  function togglePayments(id) {
    if (expandedPayments.has(id)) expandedPayments.delete(id);
    else expandedPayments.add(id);
    afterMutate();
  }

  function openPaymentModal(entryId) {
    const entry = entries.find(e => e.id === entryId);
    if (!entry) return;
    paymentEntryId = entryId;
    document.getElementById('paymentRemainingLabel').textContent = `Remaining balance: PKR ${fmt(remaining(entry))}`;
    document.getElementById('paymentAmount').value = '';
    document.getElementById('paymentDate').value = todayStr();
    document.getElementById('paymentModalBg').classList.add('show');
  }

  function closePaymentModal() {
    document.getElementById('paymentModalBg').classList.remove('show');
    paymentEntryId = null;
  }

  function savePayment() {
    const entry = entries.find(e => e.id === paymentEntryId);
    if (!entry) { closePaymentModal(); return; }
    const amt = parseAmount(document.getElementById('paymentAmount').value);
    const date = document.getElementById('paymentDate').value || todayStr();
    const rem = remaining(entry);

    if (!amt || amt <= 0) {
      alert('Enter a valid payment amount.');
      return;
    }
    if (amt > rem) {
      if (!confirm(`This payment (PKR ${fmt(amt)}) exceeds the remaining balance of PKR ${fmt(rem)}. Add it anyway?`)) return;
    }

    entry.payments = entry.payments || [];
    entry.payments.push({ id: genId(), amount: amt, date });
    saveToStorage();
    closePaymentModal();
    afterMutate();
  }

  function deletePayment(entryId, paymentId) {
    const entry = entries.find(e => e.id === entryId);
    if (!entry) return;
    if (!confirm('Remove this payment?')) return;
    entry.payments = (entry.payments || []).filter(p => p.id !== paymentId);
    saveToStorage();
    afterMutate();
  }

  function getPeopleSummary() {
    const map = {};
    entries.forEach(e => {
      const key = e.name.trim();
      if (!map[key]) map[key] = { name: key, payable: 0, receivable: 0 };
      if (e.type === 'payable') map[key].payable += remaining(e);
      else map[key].receivable += remaining(e);
    });
    return Object.values(map)
      .map(p => ({ ...p, net: p.receivable - p.payable }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }

  function renderPeople() {
    const container = document.getElementById('peopleList');
    const allPeople = getPeopleSummary();
    let people = allPeople.filter(p =>
      peopleSubView === 'archived' ? archivedNames.has(p.name) : !archivedNames.has(p.name)
    );
    if (peopleSearchQuery.trim()) {
      const q = peopleSearchQuery.trim().toLowerCase();
      people = people.filter(p => p.name.toLowerCase().includes(q));
    }

    if (people.length === 0) {
      container.innerHTML = peopleSubView === 'archived'
        ? '<div class="empty">No archived people found.</div>'
        : '<div class="empty">No people found.</div>';
      return;
    }

    container.innerHTML = people.map(p => {
      const canArchive = p.net === 0;
      const archiveBtnHtml = peopleSubView === 'archived'
        ? `<button class="archive-btn unarchive" onclick="event.stopPropagation(); unarchivePerson('${escJs(p.name)}')">Unarchive</button>`
        : (canArchive ? `<button class="archive-btn" onclick="event.stopPropagation(); archivePerson('${escJs(p.name)}')">Archive</button>` : '');
      return `
      <div class="person-card" onclick="openPersonDetail('${escJs(p.name)}')">
        <div class="pname-row">
          <div class="pname">${escapeHtml(p.name)}</div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="quick-add-btn" title="Add entry for ${escapeHtml(p.name)}" onclick="event.stopPropagation(); openModal('${escJs(p.name)}')">+</button>
            ${archiveBtnHtml}
          </div>
        </div>
        <div class="person-stats">
          <div class="stat-chip chip-payable">
            <div class="stat-label">Payable</div>
            <div class="stat-value">${fmt(p.payable)}</div>
          </div>
          <div class="stat-chip chip-receivable">
            <div class="stat-label">Receivable</div>
            <div class="stat-value">${fmt(p.receivable)}</div>
          </div>
          <div class="stat-chip chip-net">
            <div class="stat-label">Net</div>
            <div class="stat-value">${p.net >= 0 ? '+' : '-'}${fmt(Math.abs(p.net))}</div>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function escJs(str) {
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function archivePerson(name) {
    const p = getPeopleSummary().find(x => x.name === name);
    if (!p || p.net !== 0) {
      alert('This person can only be archived once their net balance is exactly 0.');
      return;
    }
    archivedNames.add(name);
    saveArchive();
    renderPeople();
  }

  function unarchivePerson(name) {
    archivedNames.delete(name);
    saveArchive();
    renderPeople();
  }

  function toggleArchiveFromDetail() {
    if (!currentPersonName) return;
    if (archivedNames.has(currentPersonName)) {
      unarchivePerson(currentPersonName);
    } else {
      const p = getPeopleSummary().find(x => x.name === currentPersonName);
      if (!p || p.net !== 0) {
        alert('This person can only be archived once their net balance is exactly 0.');
        return;
      }
      archivedNames.add(currentPersonName);
      saveArchive();
    }
    updatePdArchiveBtn();
    renderPeople();
  }

  function updatePdArchiveBtn() {
    const btn = document.getElementById('pdArchiveBtn');
    const isArchived = archivedNames.has(currentPersonName);
    btn.textContent = isArchived ? 'Unarchive' : 'Archive';
  }

  function openPersonDetail(name) {
    currentPersonName = name;
    const personEntries = entries
      .filter(e => e.name.trim() === name)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    let payable = 0, receivable = 0;
    personEntries.forEach(e => {
      if (e.type === 'payable') payable += remaining(e);
      else receivable += remaining(e);
    });
    const net = receivable - payable;

    document.getElementById('pdName').textContent = name;
    document.getElementById('pdPayable').textContent = fmt(payable);
    document.getElementById('pdReceivable').textContent = fmt(receivable);
    document.getElementById('pdNet').textContent = (net >= 0 ? '+' : '-') + fmt(Math.abs(net));
    updatePdArchiveBtn();

    const body = document.getElementById('pdBody');
    body.innerHTML = personEntries
      .map(e => entryCardHtml(e, { label: e.type === 'payable' ? 'You owe' : 'Owed to you' }))
      .join('');

    document.getElementById('personDetail').classList.add('show');
  }

  function closePersonDetail() {
    document.getElementById('personDetail').classList.remove('show');
    currentPersonName = null;
    renderPeople();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function openModal(prefillName) {
    document.getElementById('modalBg').classList.add('show');
    document.getElementById('inputName').value = prefillName || '';
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputDesc').value = '';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    setType('payable');
    if (prefillName) {
      document.getElementById('inputAmount').focus();
    }
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('show');
  }

  function setType(type) {
    currentType = type;
    document.getElementById('btnPayable').classList.toggle('active', type === 'payable');
    document.getElementById('btnPayable').classList.toggle('payable', type === 'payable');
    document.getElementById('btnReceivable').classList.toggle('active', type === 'receivable');
    document.getElementById('btnReceivable').classList.toggle('receivable', type === 'receivable');
  }

  function onAmountInput(el) {
    const cursorFromEnd = el.value.length - el.selectionStart;
    const digitsOnly = el.value.replace(/[^0-9.]/g, '');
    const parts = digitsOnly.split('.');
    const intPart = parts[0].replace(/^0+(?=\d)/, '');
    const decPart = parts.length > 1 ? '.' + parts.slice(1).join('').slice(0, 2) : '';
    const withCommas = intPart ? Number(intPart).toLocaleString('en-US') : '';
    el.value = withCommas + decPart;
    const newPos = Math.max(0, el.value.length - cursorFromEnd);
    el.setSelectionRange(newPos, newPos);
  }

  function parseAmount(str) {
    return Number(String(str).replace(/,/g, ''));
  }

  function saveEntry() {
    const name = document.getElementById('inputName').value.trim();
    const amount = parseAmount(document.getElementById('inputAmount').value);
    const desc = document.getElementById('inputDesc').value.trim();
    const date = document.getElementById('inputDate').value;

    if (!name || !amount || amount <= 0) {
      alert('Please enter a name and a valid amount.');
      return;
    }

    entries.push({
      id: genId(),
      type: currentType,
      name,
      amount,
      desc,
      date: date || todayStr(),
      payments: []
    });

    if (archivedNames.has(name)) {
      archivedNames.delete(name);
      saveArchive();
    }

    saveToStorage();
    closeModal();
    render();
  }

  function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    entries = entries.filter(e => e.id !== id);
    saveToStorage();
    afterMutate();
  }

  const LAST_BACKUP_KEY = 'loan_manager_last_backup_v1';
  const BACKUP_SCHEMA_VERSION = 3;

  function exportData() {
    const payload = {
      app: 'loan-manager',
      schemaVersion: BACKUP_SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      entries,
      archived: [...archivedNames]
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().split('T')[0];
    a.href = url;
    a.download = `loan-manager-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, Date.now().toString());
    checkBackupReminder();
  }

  // Normalizes an entry from ANY prior export format — a v1.0-1.4
  // entry with a boolean `settled` and no `payments`, or a current
  // entry with a `payments` array — into the current shape, so old
  // backups always import cleanly into newer versions of the app.
  function normalizeEntry(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const name = (raw.name || '').toString().trim();
    const amount = Number(raw.amount);
    if (!name || !amount || amount <= 0) return null;
    const e = {
      id: raw.id ? String(raw.id) : genId(),
      type: raw.type === 'receivable' ? 'receivable' : 'payable',
      name,
      amount,
      desc: raw.desc ? String(raw.desc) : '',
      date: raw.date ? String(raw.date) : todayStr(),
      payments: raw.payments,
      settled: raw.settled
    };
    return migrateEntry(e);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        // Supports every prior export shape: a bare array (earliest
        // version), or an object with an `entries` key (all later
        // versions), with or without a `schemaVersion`/`archived` field.
        const rawEntries = Array.isArray(data) ? data : data.entries;
        if (!Array.isArray(rawEntries)) throw new Error('bad format');

        const normalized = rawEntries.map(normalizeEntry).filter(Boolean);
        const rawArchived = (!Array.isArray(data) && Array.isArray(data.archived)) ? data.archived : null;

        const mode = confirm(
          'Tap OK to MERGE this backup with your current entries.\nTap Cancel to REPLACE all current entries with this backup.'
        );

        if (mode) {
          const existingIds = new Set(entries.map(en => en.id));
          normalized.forEach(en => {
            if (!existingIds.has(en.id)) entries.push(en);
          });
          if (rawArchived) rawArchived.forEach(name => archivedNames.add(String(name)));
        } else {
          entries = normalized;
          if (rawArchived) archivedNames = new Set(rawArchived.map(String));
        }

        saveToStorage();
        saveArchive();
        render();
        alert(`Import complete. You now have ${entries.length} entries.`);
      } catch (err) {
        alert('Could not read this file. Make sure it\'s a Loan Manager backup JSON.');
      } finally {
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  function checkBackupReminder() {
    const last = localStorage.getItem(LAST_BACKUP_KEY);
    const banner = document.getElementById('backupBanner');
    if (entries.length === 0) {
      banner.classList.remove('show');
      return;
    }
    const daysSince = last ? (Date.now() - Number(last)) / 86400000 : Infinity;
    if (daysSince >= 7) {
      const label = last ? `${Math.floor(daysSince)} days ago` : 'never';
      banner.textContent = `⚠ Last backup: ${label}. Tap here to export a backup file.`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  document.querySelectorAll('#filterTabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#filterTabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  document.querySelectorAll('#peopleSubtabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#peopleSubtabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      peopleSubView = tab.dataset.sub;
      renderPeople();
    });
  });

  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeModal();
  });

  document.getElementById('paymentModalBg').addEventListener('click', (e) => {
    if (e.target.id === 'paymentModalBg') closePaymentModal();
  });

  render();
  checkBackupReminder();
</script>
</body>
</html>
