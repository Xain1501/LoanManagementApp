<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Loan Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    padding-bottom: 90px;
  }
  header {
    padding: 20px 16px 12px;
    background: #15181f;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #23262f;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    background: #1b1f28;
    border: 1px solid #262a35;
    color: #9aa0ab;
    font-size: 12px;
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
  }
  .icon-btn:active { background: #262a35; }
  .backup-banner {
    display: none;
    margin-top: 12px;
    background: #2a2410;
    border: 1px solid #4a3f14;
    color: #e9c76b;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .backup-banner.show { display: block; }
  .summary {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .card {
    flex: 1;
    background: #1b1f28;
    border-radius: 12px;
    padding: 12px;
  }
  .card .label { font-size: 12px; color: #9aa0ab; }
  .card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .receivable .value { color: #4ade80; }
  .payable .value { color: #f87171; }
  .net .value { font-size: 18px; }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: #1b1f28;
    color: #9aa0ab;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #262a35;
  }
  .tab.active {
    background: #3b6ef6;
    color: #fff;
    border-color: #3b6ef6;
  }

  #list {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .entry {
    background: #1b1f28;
    border-radius: 12px;
    padding: 14px;
    position: relative;
    border-left: 4px solid #f87171;
  }
  .entry.receivable { border-left-color: #4ade80; }
  .entry .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .entry .name { font-weight: 700; font-size: 15px; }
  .entry .amount { font-weight: 700; font-size: 15px; }
  .entry.payable .amount { color: #f87171; }
  .entry.receivable .amount { color: #4ade80; }
  .entry .desc { color: #b5bac4; font-size: 13px; margin-top: 6px; }
  .entry .date { color: #6b7280; font-size: 12px; margin-top: 8px; }
  .entry .del {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: #6b7280;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .entry .name-row { padding-right: 26px; }

  .empty {
    text-align: center;
    color: #6b7280;
    padding: 60px 20px;
    font-size: 14px;
  }

  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #3b6ef6;
    color: #fff;
    font-size: 28px;
    border: none;
    box-shadow: 0 6px 16px rgba(59,110,246,0.4);
    cursor: pointer;
    z-index: 20;
  }

  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    align-items: flex-end;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #15181f;
    width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 20px 18px 26px;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: #9aa0ab;
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: #1b1f28;
    border: 1px solid #262a35;
    border-radius: 10px;
    padding: 11px 12px;
    color: #e8e8e8;
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea { resize: none; min-height: 60px; }
  .type-toggle {
    display: flex;
    gap: 8px;
  }
  .type-toggle button {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid #262a35;
    background: #1b1f28;
    color: #9aa0ab;
    font-size: 14px;
    cursor: pointer;
  }
  .type-toggle button.active.payable { background: #f87171; color: #1b1f28; border-color: #f87171; font-weight: 700; }
  .type-toggle button.active.receivable { background: #4ade80; color: #1b1f28; border-color: #4ade80; font-weight: 700; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel { background: #1b1f28; color: #9aa0ab; border: 1px solid #262a35 !important; }
  .btn-save { background: #3b6ef6; color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Loan Manager</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportData()">Export</button>
      <button class="icon-btn" onclick="document.getElementById('importFile').click()">Import</button>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  <div class="backup-banner" id="backupBanner" onclick="exportData()"></div>
  <div class="summary">
    <div class="card receivable">
      <div class="label">Receivable (PKR)</div>
      <div class="value" id="totalReceivable">0</div>
    </div>
    <div class="card payable">
      <div class="label">Payable (PKR)</div>
      <div class="value" id="totalPayable">0</div>
    </div>
    <div class="card net">
      <div class="label">Net</div>
      <div class="value" id="netValue">0</div>
    </div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-filter="all">All</div>
  <div class="tab" data-filter="receivable">Receivable</div>
  <div class="tab" data-filter="payable">Payable</div>
</div>

<div id="list"></div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>New Entry</h2>
    <div class="field">
      <label>Type</label>
      <div class="type-toggle">
        <button type="button" id="btnPayable" onclick="setType('payable')">I Owe (Payable)</button>
        <button type="button" id="btnReceivable" onclick="setType('receivable')">Owed to Me (Receivable)</button>
      </div>
    </div>
    <div class="field">
      <label>Person Name</label>
      <input type="text" id="inputName" placeholder="e.g. Ahmed">
    </div>
    <div class="field">
      <label>Amount (PKR)</label>
      <input type="number" id="inputAmount" placeholder="e.g. 5000" inputmode="decimal">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="inputDesc" placeholder="e.g. Borrowed for rent"></textarea>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="inputDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'loan_manager_entries_v1';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentType = 'payable';
  let currentFilter = 'all';

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function fmt(n) {
    return Number(n).toLocaleString('en-PK');
  }

  function render() {
    const list = document.getElementById('list');
    let totalPayable = 0, totalReceivable = 0;
    entries.forEach(e => {
      if (e.type === 'payable') totalPayable += Number(e.amount);
      else totalReceivable += Number(e.amount);
    });
    document.getElementById('totalPayable').textContent = fmt(totalPayable);
    document.getElementById('totalReceivable').textContent = fmt(totalReceivable);
    const net = totalReceivable - totalPayable;
    const netEl = document.getElementById('netValue');
    netEl.textContent = (net >= 0 ? '+' : '-') + fmt(Math.abs(net));
    netEl.style.color = net >= 0 ? '#4ade80' : '#f87171';

    let filtered = entries;
    if (currentFilter !== 'all') filtered = entries.filter(e => e.type === currentFilter);
    filtered = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No entries yet. Tap + to add one.</div>';
      return;
    }

    list.innerHTML = filtered.map(e => `
      <div class="entry ${e.type}">
        <button class="del" onclick="deleteEntry('${e.id}')">&times;</button>
        <div class="top">
          <div class="name-row">
            <div class="name">${escapeHtml(e.name)}</div>
          </div>
          <div class="amount">${e.type === 'payable' ? '-' : '+'} PKR ${fmt(e.amount)}</div>
        </div>
        ${e.desc ? `<div class="desc">${escapeHtml(e.desc)}</div>` : ''}
        <div class="date">${formatDate(e.date)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function openModal() {
    document.getElementById('modalBg').classList.add('show');
    document.getElementById('inputName').value = '';
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputDesc').value = '';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    setType('payable');
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('show');
  }

  function setType(type) {
    currentType = type;
    document.getElementById('btnPayable').classList.toggle('active', type === 'payable');
    document.getElementById('btnPayable').classList.toggle('payable', type === 'payable');
    document.getElementById('btnReceivable').classList.toggle('active', type === 'receivable');
    document.getElementById('btnReceivable').classList.toggle('receivable', type === 'receivable');
  }

  function saveEntry() {
    const name = document.getElementById('inputName').value.trim();
    const amount = document.getElementById('inputAmount').value;
    const desc = document.getElementById('inputDesc').value.trim();
    const date = document.getElementById('inputDate').value;

    if (!name || !amount || Number(amount) <= 0) {
      alert('Please enter a name and a valid amount.');
      return;
    }

    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      type: currentType,
      name,
      amount: Number(amount),
      desc,
      date: date || new Date().toISOString().split('T')[0]
    });

    saveToStorage();
    closeModal();
    render();
  }

  function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    entries = entries.filter(e => e.id !== id);
    saveToStorage();
    render();
  }

  const LAST_BACKUP_KEY = 'loan_manager_last_backup_v1';

  function exportData() {
    const payload = {
      app: 'loan-manager',
      exportedAt: new Date().toISOString(),
      entries
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().split('T')[0];
    a.href = url;
    a.download = `loan-manager-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, Date.now().toString());
    checkBackupReminder();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        const imported = Array.isArray(data) ? data : data.entries;
        if (!Array.isArray(imported)) throw new Error('bad format');

        const mode = confirm(
          'Tap OK to MERGE this backup with your current entries.\nTap Cancel to REPLACE all current entries with this backup.'
        );

        if (mode) {
          const existingIds = new Set(entries.map(e => e.id));
          imported.forEach(e => {
            if (!existingIds.has(e.id)) entries.push(e);
          });
        } else {
          entries = imported;
        }

        saveToStorage();
        render();
        alert(`Import complete. You now have ${entries.length} entries.`);
      } catch (err) {
        alert('Could not read this file. Make sure it\'s a Loan Manager backup JSON.');
      } finally {
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  function checkBackupReminder() {
    const last = localStorage.getItem(LAST_BACKUP_KEY);
    const banner = document.getElementById('backupBanner');
    if (entries.length === 0) {
      banner.classList.remove('show');
      return;
    }
    const daysSince = last ? (Date.now() - Number(last)) / 86400000 : Infinity;
    if (daysSince >= 7) {
      const label = last ? `${Math.floor(daysSince)} days ago` : 'never';
      banner.textContent = `⚠ Last backup: ${label}. Tap here to export a backup file.`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeModal();
  });

  render();
  checkBackupReminder();
</script>
</body>
</html>
